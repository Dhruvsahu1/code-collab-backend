server:
  port: 8081
  error:
    include-message: always

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/codecollab_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: dhruvsh@97
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  security:
    cors:
      configuration-source: |
        {
          "corsConfigurations": {
            "/**": {
              "allowedOrigins": ["http://localhost:5173", "http://localhost:3000", "http://127.0.0.1:5173"],
              "allowedMethods": ["GET", "POST", "PUT", "DELETE", "OPTIONS", "PATCH"],
              "allowedHeaders": ["*"],
              "exposedHeaders": ["Authorization"],
              "allowCredentials": true,
              "maxAge": 3600
            }
          }
        }

app:
  jwt:
    secret: your-256-bit-secret-key-here-must-be-at-least-32-characters-long-for-security
    expiration: 86400000
    refresh-expiration: 604800000

logging:
  level:
    org.springframework.security: DEBUG