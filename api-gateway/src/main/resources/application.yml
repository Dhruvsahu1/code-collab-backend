server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: project-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/projects/**
          filters:
            - StripPrefix=1
        - id: file-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/files/**
          filters:
            - StripPrefix=1
        - id: collab-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/sessions/**
          filters:
            - StripPrefix=0
        - id: collab-websocket
          uri: http://localhost:8084
          predicates:
            - Path=/ws-collab/**
          filters:
            - StripPrefix=0
            - DedupeResponseHeader=exclusive
        - id: version-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/versions/**
          filters:
            - StripPrefix=1
        - id: execution-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/executions/**
          filters:
            - StripPrefix=1
        - id: execution-websocket
          uri: http://localhost:8085
          predicates:
            - Path=/ws/executions/**
          filters:
            - StripPrefix=0
        - id: comment-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/comments/**
          filters:
            - StripPrefix=1
        - id: chat-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/chats/**
          filters:
            - StripPrefix=1
        - id: chat-websocket
          uri: http://localhost:8089
          predicates:
            - Path=/ws/chats/**
          filters:
            - StripPrefix=0
        - id: notification-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1
        - id: notification-websocket
          uri: http://localhost:8091
          predicates:
            - Path=/ws/notifications/**
          filters:
            - StripPrefix=0
      discovery:
        locator:
          enabled: false
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "http://127.0.0.1:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - Authorization
            allowCredentials: true
            maxAge: 3600

app:
  jwt:
    secret: your-256-bit-secret-key-here-must-be-at-least-32-characters-long-for-security

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
