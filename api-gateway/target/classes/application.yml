server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: project-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/projects/**
          filters:
            - StripPrefix=1
        - id: file-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/files/**
          filters:
            - StripPrefix=1
        - id: editor-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/editor/**
          filters:
            - StripPrefix=1
        - id: collab-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/collab/**
          filters:
            - StripPrefix=1
        - id: execution-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/execution/**
          filters:
            - StripPrefix=1
        - id: version-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/version/**
          filters:
            - StripPrefix=1
        - id: comment-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/comments/**
          filters:
            - StripPrefix=1
      discovery:
        locator:
          enabled: false
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"

app:
  jwt:
    secret: your-256-bit-secret-key-here-must-be-at-least-32-characters-long-for-security

logging:
  level:
    org.springframework.cloud.gateway: DEBUG